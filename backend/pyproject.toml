[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-backend"
version = "0.1.0"
description = "Local RAG application scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "httpx>=0.28,<0.29",
    "qdrant-client>=1.15,<1.16",
]

[tool.setuptools.packages.find]
include = ["app*"]
